font_family                Fantasque Sans Mono
font_size                  11.0

hide_window_decorations    yes

background_opacity         0.8
dynamic_background_opacity yes

kitty_mod                  ctrl+shift

map kitty_mod+n            launch --cwd=current
map kitty_mod+enter        new_window
map kitty_mod+]            next_window
map kitty_mod+[            previous_window
map kitty_mod+tab          next_tab
map kitty_mod+t            new_tab_with_cwd
map kitty_mod+y            new_tab
map kitty_mod+l            next_layout
map kitty_mod+equal        change_font_size all +1.0
map kitty_mod+minus        change_font_size all -1.0
map kitty_mod+0            change_font_size all 0
map kitty_mod+4            set_background_opacity +0.01
map kitty_mod+3            set_background_opacity -0.01
map kitty_mod+1            set_background_opacity 1
map kitty_mod+2            set_background_opacity default
map kitty_mod+r            load_config_file

include current-theme.conf
